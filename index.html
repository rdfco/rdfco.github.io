<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/Fara-Logo0Small.png?v=2" />
    <title>FARA</title>
    <style>
      html,
      body,
      #root,
      .legacy-shell,
      .legacy-site {
        width: 100%;
        height: 100%;
        margin: 0;
      }
      html,
      body,
      #root,
      .legacy-shell {
        max-width: 100%;
        overflow-x: hidden;
      }
      .legacy-shell {
        position: relative;
        overflow: hidden;
        background: #071d2e;
      }
      .legacy-shell[data-route-surface='content'] {
        background: #fff;
      }
      .legacy-shell[data-route-surface='content'] .legacy-site {
        opacity: 1;
      }
      .legacy-site {
        display: block;
        border: 0;
        opacity: 0;
        transition: opacity 180ms ease;
      }
      .legacy-shell[data-status='ready'] .legacy-site {
        opacity: 1;
      }
      .site-gate {
        position: absolute;
        z-index: 2;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
        color: #fff;
        background: #071d2e;
        font: 500 1rem/1.5 sans-serif;
        text-align: center;
      }
      .legacy-shell[data-status='ready'] .site-gate {
        display: none;
      }
      .site-loader {
        display: grid;
        place-items: center;
      }
      .site-loader__spinner {
        width: 3rem;
        height: 3rem;
        border: 2px solid rgba(255, 255, 255, .2);
        border-top-color: #fff;
        border-radius: 50%;
        animation: fara-loader-spin 800ms linear infinite;
      }
      @keyframes fara-loader-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="legacy-shell" data-status="loading" data-route-surface="home">
        <div class="site-gate" role="status">
          <div class="site-loader" aria-label="Loading">
            <span class="site-loader__spinner" aria-hidden="true"></span>
          </div>
        </div>
        <iframe
          class="legacy-site"
          title="FARA"
          src="/legacy/fort-energy/index.html?v=oil-bg-sync-20260801-2"
          sandbox="allow-scripts allow-same-origin"
        ></iframe>
      </div>
    </div>
    <script>
      ;(() => {
        const shell = document.querySelector('.legacy-shell')
        if (!shell) return
        shell.dataset.routeSurface = window.location.pathname === '/' ? 'home' : 'content'
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Edit this file to recolor the WebGL background. It must load before React. -->
    <script src="/background-colors.js"></script>
  </body>
</html>
